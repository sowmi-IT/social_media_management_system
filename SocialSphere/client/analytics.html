<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics — SocialSphere</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <div id="sidebar-mount"></div>

  <main class="main">
    <div class="page-head">
      <div>
        <p class="eyebrow">Performance</p>
        <h1>Analytics</h1>
        <p class="sub">A roll-up of everything you've posted.</p>
      </div>
    </div>

    <div class="stat-grid" id="stat-grid"></div>

    <div class="card" style="margin-bottom:20px;">
      <h3 style="margin-bottom:14px;">Posts by platform</h3>
      <div id="platform-bars"></div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:14px;">Most recent posts</h3>
      <div class="post-list" id="recent-list"></div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/guard.js"></script>
<script>
  async function load() {
    try {
      const { totals, byPlatform, recent } = await Api.analyticsSummary();

      document.getElementById("stat-grid").innerHTML = `
        <div class="stat-card"><div class="label">Total posts</div><div class="value">${totals.total_posts}</div></div>
        <div class="stat-card"><div class="label">Published</div><div class="value">${totals.published || 0}</div></div>
        <div class="stat-card"><div class="label">Scheduled</div><div class="value">${totals.scheduled || 0}</div></div>
        <div class="stat-card"><div class="label">Drafts</div><div class="value accent">${totals.drafts || 0}</div></div>
        <div class="stat-card"><div class="label">Total views</div><div class="value">${totals.total_views || 0}</div></div>
        <div class="stat-card"><div class="label">Total likes</div><div class="value">${totals.total_likes || 0}</div></div>
      `;

      const maxCount = Math.max(1, ...byPlatform.map(p => p.count));
      const bars = document.getElementById("platform-bars");
      if (!byPlatform.length) {
        bars.innerHTML = `<p class="sub">No posts yet — create one to see platform breakdown.</p>`;
      } else {
        bars.innerHTML = byPlatform.map(p => `
          <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
            <div style="width:110px; font-size:0.85rem; color:var(--ink-700);">${escapeHtml(p.platform)}</div>
            <div style="flex:1; background:var(--paper); border-radius:6px; overflow:hidden; height:14px;">
              <div style="width:${(p.count / maxCount) * 100}%; background:var(--amber-500); height:100%;"></div>
            </div>
            <div style="width:24px; text-align:right; font-family:var(--font-mono); font-size:0.85rem;">${p.count}</div>
          </div>
        `).join("");
      }

      const list = document.getElementById("recent-list");
      if (!recent.length) {
        list.innerHTML = `<div class="empty-state"><div class="icon">📊</div><h3>Nothing to show yet</h3><p>Your recent posts will appear here.</p></div>`;
      } else {
        list.innerHTML = recent.map(p => `
          <div class="post-row">
            <div class="info">
              <h3>${escapeHtml(p.title)}</h3>
              <div class="meta">
                <span class="pill pill-${p.status}">${p.status}</span>
                <span>${escapeHtml(p.platform)}</span>
                <span>${formatDate(p.created_at)}</span>
              </div>
            </div>
            <a href="view.html?id=${p.id}" class="btn btn-outline btn-sm">View</a>
          </div>
        `).join("");
      }
    } catch (err) {
      toast(err.message, "error");
    }
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  if (requireAuth()) load();
</script>
</body>
</html>
