<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — SocialSphere</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-visual">
    <div class="brand"><span class="mark">S</span> SocialSphere</div>
    <h2>Almost there.</h2>
    <p>Paste the token from the previous step and choose a new password.</p>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <h1>Choose a new password</h1>
      <p class="sub">Step 2: set a new password with your reset token.</p>

      <div class="alert" id="alert-box"></div>

      <form id="reset-form">
        <div class="field">
          <label for="token">Reset token</label>
          <input class="input" id="token" type="text" placeholder="Paste your reset token" required>
        </div>
        <div class="field">
          <label for="newPassword">New password</label>
          <input class="input" id="newPassword" type="password" placeholder="At least 6 characters" required minlength="6">
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input class="input" id="confirmPassword" type="password" placeholder="Repeat new password" required minlength="6">
        </div>
        <div class="field">
          <label class="checkbox-row">
            <input type="checkbox" id="show-password" onclick="togglePasswords()"> Show passwords
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Reset password</button>
      </form>

      <div class="switch">Remembered it? <a href="login.html">Back to log in</a></div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  function togglePasswords() {
    const type = document.getElementById("show-password").checked ? "text" : "password";
    document.getElementById("newPassword").type = type;
    document.getElementById("confirmPassword").type = type;
  }

  const params = new URLSearchParams(window.location.search);
  if (params.get("token")) document.getElementById("token").value = params.get("token");

  const form = document.getElementById("reset-form");
  const alertBox = document.getElementById("alert-box");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideAlert(alertBox);

    const token = document.getElementById("token").value.trim();
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (newPassword !== confirmPassword) {
      showAlert(alertBox, "Passwords do not match.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Resetting...";

    try {
      await Api.resetPassword({ token, newPassword, confirmPassword });
      toast("Password reset. Please log in.", "success");
      setTimeout(() => window.location.href = "login.html", 900);
    } catch (err) {
      showAlert(alertBox, err.message);
      submitBtn.disabled = false;
      submitBtn.textContent = "Reset password";
    }
  });
</script>
</body>
</html>
