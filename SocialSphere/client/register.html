<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — SocialSphere</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-visual">
    <div class="brand"><span class="mark">S</span> SocialSphere</div>
    <h2>Set up your control room in under a minute.</h2>
    <p>One account gets you drafts, scheduling, and a dashboard that actually shows what's happening.</p>
    <div class="quote">Free while you're getting started — no card required.</div>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="sub">Takes about a minute.</p>

      <div class="alert" id="alert-box"></div>

      <form id="register-form">
        <div class="field">
          <label for="fullname">Full name</label>
          <input class="input" id="fullname" type="text" placeholder="Enter your full name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="phone">Phone number</label>
          <input class="input" id="phone" type="text" placeholder="Enter phone number">
        </div>
        <div class="row-2">
          <div class="field">
            <label for="password">Password</label>
            <input class="input" id="password" type="password" placeholder="At least 6 characters" required minlength="6">
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <input class="input" id="confirmPassword" type="password" placeholder="Repeat password" required minlength="6">
          </div>
        </div>
        <div class="field">
          <label class="checkbox-row">
            <input type="checkbox" id="show-password"> Show passwords
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create account</button>
      </form>

      <div class="switch">Already have an account? <a href="login.html">Log in</a></div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  const form = document.getElementById("register-form");
  const alertBox = document.getElementById("alert-box");
  const submitBtn = document.getElementById("submit-btn");

  document.getElementById("show-password").addEventListener("change", (e) => {
    const type = e.target.checked ? "text" : "password";
    document.getElementById("password").type = type;
    document.getElementById("confirmPassword").type = type;
  });

  if (Auth.isLoggedIn()) window.location.href = "dashboard.html";

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideAlert(alertBox);

    const fullname = document.getElementById("fullname").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
      showAlert(alertBox, "Passwords do not match.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account...";

    try {
      const data = await Api.register({ fullname, email, phone, password, confirmPassword });
      Auth.setToken(data.token);
      Auth.setUser(data.user);
      window.location.href = "dashboard.html";
    } catch (err) {
      showAlert(alertBox, err.message);
      submitBtn.disabled = false;
      submitBtn.textContent = "Create account";
    }
  });
</script>
</body>
</html>
